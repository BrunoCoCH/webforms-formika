# =============================================================================
# Lovable Integration Guide
# =============================================================================
#
# Instructions for connecting a Lovable-built site's contact form
# to the Cloudflare Worker backend.
#
# Prerequisites:
#   - The site's origin must be added to the worker's SITE_CONFIG env var
#   - The worker is deployed at:
#     https://contact-worker.example.workers.dev/contact
# =============================================================================

# Paste the following as a prompt in Lovable:

prompt: |
  Replace the current contact form submission logic with a POST request
  to an external backend endpoint.

  Requirements:
  - Do NOT use Supabase
  - Do NOT use any built-in database integration
  - Keep the current UI and styling unchanged

  Form fields to send:
  - first_name
  - last_name
  - email
  - phone
  - company
  - subject
  - message

  Also include:
  - site: set this to the current website domain as a string
  - website_url: hidden honeypot field, default empty string
  - status: "new"
  - notes: ""

  Endpoint:
  - Send a POST request to:
    https://contact-worker.example.workers.dev/contact

  Request format:
  - Method: POST
  - Header: Content-Type: application/json
  - Body: JSON.stringify({
      site,
      first_name,
      last_name,
      email,
      phone,
      company,
      subject,
      message,
      website_url,
      status,
      notes
    })

  Behavior:
  - Show a loading state while the form is submitting
  - On success, show: "Message sent successfully"
  - On failure, show a clear error message
  - Prevent submission if required fields are missing
  - Prevent submission if website_url is filled in (honeypot)

  Validation:
  - Required fields:
    - first_name
    - email
    - message
  - Validate email format before sending

  Implementation details:
  - Use fetch()
  - Use async/await
  - Do not expose any API keys in frontend code
  - Keep the existing form layout unchanged
  - If there is already a submit handler, replace only the submission logic

  Example payload:
  {
    "site": "example.com",
    "first_name": "John",
    "last_name": "Doe",
    "email": "john@example.com",
    "phone": "+41 79 123 45 67",
    "company": "Acme SA",
    "subject": "Project inquiry",
    "message": "Hello, I would like to discuss a website project.",
    "website_url": "",
    "status": "new",
    "notes": ""
  }

# --- Newsletter variant ---
#
# For a newsletter signup form, use this simplified prompt:

newsletter_prompt: |
  Add a newsletter signup form that sends a POST request to an external endpoint.

  Requirements:
  - Do NOT use Supabase or any built-in database
  - Keep the current UI and styling

  Fields:
  - email (required)
  - first_name (optional, default to "Subscriber" if empty)

  Endpoint: POST https://contact-worker.example.workers.dev/contact
  Header: Content-Type: application/json
  Body: JSON.stringify({
    site: window.location.hostname,
    first_name: first_name || "Subscriber",
    email: email,
    message: "Newsletter subscription",
    subject: "Newsletter signup",
    website_url: "",
    status: "new",
    notes: ""
  })

  On success: show "Thanks for subscribing!"
  On failure: show a clear error message
  Validate email format before sending.
  Use fetch() with async/await.
